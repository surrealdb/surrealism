[[test]]
name = "returns the created page url"
fn = "create_page"
args = [
  "'ntn_0123456789abcdef'",
  "'2f1a4c9e8b7d4e6fa1c30d5b6e7f8a90'",
  "{ Name: { title: [{ text: { content: 'Launch checklist' } }] }, Status: { select: { name: 'In progress' } } }",
]
stdin = "{ object: 'page', id: '8c9d0e1f-2a3b-4c5d-8e9f-0a1b2c3d4e5f', created_time: '2026-08-10T09:14:00.000Z', archived: false, parent: { type: 'database_id', database_id: '2f1a4c9e-8b7d-4e6f-a1c3-0d5b6e7f8a90' }, url: 'https://www.notion.so/Launch-checklist-8c9d0e1f2a3b4c5d8e9f0a1b2c3d4e5f' }"
contains = "https://www.notion.so/Launch-checklist-8c9d0e1f2a3b4c5d8e9f0a1b2c3d4e5f"

[[test]]
name = "returns a validation error payload unchanged"
fn = "create_page"
args = [
  "'ntn_0123456789abcdef'",
  "'2f1a4c9e8b7d4e6fa1c30d5b6e7f8a90'",
  "{ Nope: { rich_text: [] } }",
]
stdin = "{ object: 'error', status: 400, code: 'validation_error', message: 'Nope is not a property that exists.', request_id: '9f2c1d40-6b7a-4a3e-9c11-2f0a4b6d8e10' }"
contains = "validation_error"

[[test]]
name = "returns the fetched page properties"
fn = "get_page"
args = ["'ntn_0123456789abcdef'", "'8c9d0e1f-2a3b-4c5d-8e9f-0a1b2c3d4e5f'"]
stdin = "{ object: 'page', id: '8c9d0e1f-2a3b-4c5d-8e9f-0a1b2c3d4e5f', last_edited_time: '2026-08-10T09:20:00.000Z', archived: false, properties: { Name: { id: 'title', type: 'title', title: [{ type: 'text', plain_text: 'Launch checklist' }] } }, url: 'https://www.notion.so/Launch-checklist-8c9d0e1f2a3b4c5d8e9f0a1b2c3d4e5f' }"
contains = "plain_text: 'Launch checklist'"

[[test]]
name = "reports a missing page as an object_not_found payload"
fn = "get_page"
args = ["'ntn_0123456789abcdef'", "'00000000-0000-0000-0000-000000000000'"]
stdin = "{ object: 'error', status: 404, code: 'object_not_found', message: 'Could not find page with ID: 00000000-0000-0000-0000-000000000000.', request_id: '3b8e5a71-0c4d-42f1-8a2b-77d9e0c15a3f' }"
contains = "object_not_found"

[[test]]
name = "returns the paginated database rows"
fn = "query_database"
args = ["'ntn_0123456789abcdef'", "'2f1a4c9e8b7d4e6fa1c30d5b6e7f8a90'"]
stdin = "{ object: 'list', results: [{ object: 'page', id: '8c9d0e1f-2a3b-4c5d-8e9f-0a1b2c3d4e5f', properties: { Name: { type: 'title', title: [{ plain_text: 'Launch checklist' }] } } }], next_cursor: NULL, has_more: false, type: 'page_or_database' }"
contains = "has_more: false"

[[test]]
name = "fails when the database query cannot be completed"
fn = "query_database"
args = ["'ntn_0123456789abcdef'", "'2f1a4c9e8b7d4e6fa1c30d5b6e7f8a90'"]
error = "Call to host 'http::post' failed"
