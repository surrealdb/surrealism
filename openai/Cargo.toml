[package]
name = "surrealism-openai"
version = "0.1.0"
edition = "2024"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "OpenAI embeddings and chat completions for Surrealism"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surrealdb/surrealism"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
surrealism = "0.5"
surrealdb-types = "3.2"
anyhow = "1"
serde_json = "1"

[lints.clippy]
allow_attributes = "allow"
