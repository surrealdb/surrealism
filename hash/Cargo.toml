[package]
name = "surrealism-hash"
version = "0.1.0"
edition = "2024"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "Hashing, HMAC, and encoding functions for Surrealism"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surrealdb/surrealism"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
surrealism = "0.5"
surrealdb-types = "3.2"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
ulid = "1"
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
allow_attributes = "allow"
