[package]
name = "surrealism-markdown"
version = "0.1.0"
edition = "2024"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "Markdown to HTML rendering functions for Surrealism"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surrealdb/surrealism"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
surrealism = "0.5"
surrealdb-types = "3.2"
pulldown-cmark = "0.12"

[lints.clippy]
allow_attributes = "allow"
