[package]
name = "surrealism-cron"
version = "0.1.0"
edition = "2024"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "Cron expression parsing and next-occurrence computation for Surrealism"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surrealdb/surrealism"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
surrealism = "0.5"
surrealdb-types = "3.2"
croner = "2"
chrono = "0.4"

[lints.clippy]
allow_attributes = "allow"
