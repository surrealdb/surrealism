[[test]]
name = "reports identical text as a perfect ratio"
fn = "ratio"
args = ["'hello world'", "'hello world'"]
expect = "1f"

[[test]]
name = "reports wholly different lines as a zero ratio"
fn = "ratio"
args = ["'abc'", "'xyz'"]
expect = "0f"

[[test]]
name = "reports a partial ratio when one line of three changes"
fn = "ratio"
args = ["'one\\ntwo\\nthree\\n'", "'one\\n2\\nthree\\n'"]
expect = "0.6666666865348816f"

[[test]]
name = "emits a unified hunk for a changed line"
fn = "unified"
args = ["'one\\ntwo\\nthree\\n'", "'one\\n2\\nthree\\n'"]
expect = "'--- a\\n+++ b\\n@@ -1,3 +1,3 @@\\n one\\n-two\\n+2\\n three\\n'"

[[test]]
name = "emits nothing when both sides are identical"
fn = "unified"
args = ["'same\\n'", "'same\\n'"]
expect = "''"
