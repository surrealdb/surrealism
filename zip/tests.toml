[[test]]
name = "builds an archive from a single text file"
fn = "create"
args = ["{ 'a.txt': 'hello' }"]
expect = 'b"504B03041400000008000000210086A61036070000000500000005000000612E747874CB48CDC9C90700504B010214031400000008000000210086A610360700000005000000050000000000000000000000A48100000000612E747874504B05060000000001000100330000002A0000000000"'

[[test]]
name = "rejects a files argument that is not an object"
fn = "create"
args = ["'nope'"]
error = "files must be an object"

[[test]]
name = "rejects file content that is neither a string nor bytes"
fn = "create"
args = ["{ 'a.txt': 42 }"]
error = "Unsupported file content type"

[[test]]
name = "extracts every entry as bytes keyed by filename"
fn = "extract"
args = ['b""']
expect = '{ "a.txt": b"68656C6C6F", "b.txt": b"776F726C64" }'

[[test]]
name = "rejects data that is not a zip archive"
fn = "extract"
args = ['b"deadbeef"']
error = "invalid Zip archive"
