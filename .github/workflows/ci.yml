name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new SurrealDB release cannot change build or test results.
  SURREAL_VERSION: v3.2.3

jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: list
        run: |
          modules=$(for d in */; do
            [ -f "$d/surrealism.toml" ] && basename "$d"
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Found $(echo "$modules" | jq length) modules"

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain
        run: rustup show
      - name: Check formatting
        run: |
          status=0
          for d in */; do
            [ -f "$d/surrealism.toml" ] || continue
            (cd "$d" && cargo fmt --check) || status=1
          done
          exit $status

  module:
    name: ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # rust-toolchain.toml pins the version, components and target.
      - name: Install toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ matrix.module }}
          key: ${{ matrix.module }}

      # --locked fails if Cargo.lock is missing or would need updating, so the
      # committed lockfile is what gets compiled.
      - name: Clippy
        working-directory: ${{ matrix.module }}
        run: cargo clippy --locked --target wasm32-wasip2 --all-targets -- -D warnings

      # The release tarball is fetched directly rather than through
      # install.surrealdb.com, so the installed version is exactly the pinned
      # one and nothing depends on the installer script.
      - name: Install SurrealDB ${{ env.SURREAL_VERSION }}
        run: |
          mkdir -p "$HOME/.surrealdb"
          curl -sSfL \
            "https://download.surrealdb.com/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz" \
            | tar -xz -C "$HOME/.surrealdb"
          chmod +x "$HOME/.surrealdb/surreal"
          echo "$HOME/.surrealdb" >> "$GITHUB_PATH"
          "$HOME/.surrealdb/surreal" version

      - name: Build module
        working-directory: ${{ matrix.module }}
        run: surreal module build --debug -o ${{ matrix.module }}.surli .

      # `surreal module build` has no --locked flag of its own, so confirm the
      # build did not resolve to anything outside the committed lockfile.
      - name: Check lockfile is unchanged
        working-directory: ${{ matrix.module }}
        run: git diff --exit-code Cargo.lock

      - name: Show exported functions
        working-directory: ${{ matrix.module }}
        run: surreal module info ${{ matrix.module }}.surli

      - name: Run module tests
        run: python3 scripts/run-module-tests.py ${{ matrix.module }} --surreal surreal

  # Single required check, so branch protection does not need updating whenever
  # a module is added or removed.
  ci:
    name: CI
    if: always()
    needs: [format, module]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "format: ${{ needs.format.result }}"
          echo "module: ${{ needs.module.result }}"
          [ "${{ needs.format.result }}" = "success" ] || exit 1
          [ "${{ needs.module.result }}" = "success" ] || exit 1
