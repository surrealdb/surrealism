[[test]]
name = "derives the RFC 8032 public key from its seed"
fn = "public_key"
args = ["b\"9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60\""]
expect = "b\"D75A980182B10AB7D54BFED3C964073A0EE172F3DAA62325AF021A68F707511A\""

[[test]]
name = "rejects a seed that is not 32 bytes"
fn = "public_key"
args = ["b\"00112233\""]
error = "secret_key must be 32 bytes"

[[test]]
name = "produces the RFC 8032 signature for a one-byte message"
fn = "sign"
args = [
  "b\"4ccd089b28ff96da9db6c346ec114e0f5b8a319f35aba624da8cf6ed4fb8a6fb\"",
  "b\"72\"",
]
expect = "b\"92A009A9F0D4CAB8720E820B5F642540A2B27B5416503F8FB3762223EBDB69DA085AC1E43E15996E458F3613D0F11D8C387B2EAEB4302AEEB00D291612BB0C00\""

[[test]]
name = "signs an empty message"
fn = "sign"
args = ["b\"9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60\"", "b\"\""]
expect = "b\"E5564300C360AC729086E2CC806E828A84877F1EB8E5D974D873E065224901555FB8821590A33BACC61E39701CF9B46BD25BF5F0595BBE24655141438E7A100B\""

[[test]]
name = "refuses to sign with a short seed"
fn = "sign"
args = ["b\"aabb\"", "b\"68656c6c6f\""]
error = "secret_key must be 32 bytes"

[[test]]
name = "accepts a signature over the message it was made for"
fn = "verify"
args = [
  "b\"3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c\"",
  "b\"72\"",
  "b\"92a009a9f0d4cab8720e820b5f642540a2b27b5416503f8fb3762223ebdb69da085ac1e43e15996e458f3613d0f11d8c387b2eaeb4302aeeb00d291612bb0c00\"",
]
expect = "true"

[[test]]
name = "rejects a signature once the message is altered"
fn = "verify"
args = [
  "b\"3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c\"",
  "b\"73\"",
  "b\"92a009a9f0d4cab8720e820b5f642540a2b27b5416503f8fb3762223ebdb69da085ac1e43e15996e458f3613d0f11d8c387b2eaeb4302aeeb00d291612bb0c00\"",
]
expect = "false"

[[test]]
name = "fails when the signature is not 64 bytes"
fn = "verify"
args = [
  "b\"3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c\"",
  "b\"72\"",
  "b\"00112233\"",
]
error = "signature must be 64 bytes"

[[test]]
name = "generates a secret key seed"
fn = "generate_secret_key"
args = []
