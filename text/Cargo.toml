[package]
name = "surrealism-text"
version = "0.1.0"
edition = "2024"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "String and text manipulation functions for Surrealism"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surrealdb/surrealism"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
surrealism = "0.5"
surrealdb-types = "3.2"
deunicode = "1"
heck = "0.5"
regex = "1"

[lints.clippy]
allow_attributes = "allow"
