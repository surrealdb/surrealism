[package]
name = "surrealism-api"
version = "0.1.0"
edition = "2024"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "Third-party API integrations for Surrealism (Discord, Slack, ...)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surrealdb/surrealism"
publish = false

# Each module in this repo is an independent Cargo project (its own workspace,
# own Cargo.lock) so it can be built, versioned, and eventually published on
# its own.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
surrealism = "0.5"
surrealdb-types = "3.2"
anyhow = "1"
serde_json = "1"

[lints.clippy]
allow_attributes = "allow"
