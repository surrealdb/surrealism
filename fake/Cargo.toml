[package]
name = "surrealism-fake"
version = "0.1.0"
edition = "2024"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "Realistic fake data generation functions for Surrealism"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surrealdb/surrealism"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
surrealism = "0.5"
surrealdb-types = "3.2"
fake = "3"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
allow_attributes = "allow"
