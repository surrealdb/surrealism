[package]
name = "surrealism-barcode"
version = "0.1.0"
edition = "2024"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "Linear barcode generation (Code128, EAN-13) for Surrealism, rendered as PNG bytes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surrealdb/surrealism"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
surrealism = "0.5"
surrealdb-types = "3.2"
barcoders = { version = "2", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.clippy]
allow_attributes = "allow"
