[[test]]
name = "reports the pixel dimensions of a PNG"
fn = "dimensions"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
]
expect = "[4, 2]"

[[test]]
name = "rejects data that is not a recognisable image"
fn = "dimensions"
args = ['b"deadbeef"']
error = "Could not determine image format"

[[test]]
name = "resizes to the exact requested dimensions"
fn = "resize"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "2",
  "1",
]
contains = "494844520000000200000001"

[[test]]
name = "rejects a zero width"
fn = "resize"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "0",
  "1",
]
error = "dimension must be greater than zero"

[[test]]
name = "rejects a negative width"
fn = "resize"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "(-4)",
  "2",
]
error = "dimension must be a positive integer"

[[test]]
name = "shrinks a thumbnail to fit the bounding box, keeping the aspect ratio"
fn = "thumbnail"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "2",
]
contains = "494844520000000200000001"

[[test]]
name = "rejects a zero thumbnail size"
fn = "thumbnail"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "0",
]
error = "dimension must be greater than zero"

[[test]]
name = "re-encodes as a single-channel greyscale PNG"
fn = "grayscale"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
]
contains = "4948445200000004000000020800"

[[test]]
name = "converts a PNG into a JPEG"
fn = "convert"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "'jpeg'",
]
contains = "FFD8FFE000104A464946"

[[test]]
name = "rejects an unknown target format"
fn = "convert"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "'notaformat'",
]
error = "Unsupported or unrecognised image format"

[[test]]
name = "desaturates without changing the dimensions"
fn = "saturate"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "0.0",
]
contains = "494844520000000400000002"

[[test]]
name = "boosts saturation without changing the dimensions"
fn = "saturate"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "2.0",
]
contains = "494844520000000400000002"

[[test]]
name = "swaps width and height when rotating a quarter turn"
fn = "rotate"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "90",
]
contains = "494844520000000200000004"

[[test]]
name = "keeps the dimensions when rotating a half turn"
fn = "rotate"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "180",
]
contains = "494844520000000400000002"

[[test]]
name = "rejects a rotation that is not a quarter turn"
fn = "rotate"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "45",
]
error = "degrees must be one of 0, 90, 180, 270"

[[test]]
name = "mirrors left to right"
fn = "flip_horizontal"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
]
contains = "494844520000000400000002"

[[test]]
name = "mirrors top to bottom"
fn = "flip_vertical"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
]
contains = "494844520000000400000002"

[[test]]
name = "blurs without changing the dimensions"
fn = "blur"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "1.5",
]
contains = "494844520000000400000002"

[[test]]
name = "crops to the requested region"
fn = "crop"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "0",
  "0",
  "2",
  "1",
]
contains = "494844520000000200000001"

[[test]]
name = "rejects a negative x offset"
fn = "crop"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "(-1)",
  "0",
  "2",
  "1",
]
error = "x must not be negative"

[[test]]
name = "rejects a negative y offset"
fn = "crop"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "0",
  "(-2)",
  "2",
  "1",
]
error = "y must not be negative"

[[test]]
name = "inverts the colours without changing the dimensions"
fn = "invert"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
]
contains = "494844520000000400000002"

[[test]]
name = "brightens without changing the dimensions"
fn = "brightness"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "40",
]
contains = "494844520000000400000002"

[[test]]
name = "rejects a brightness adjustment beyond 32-bit range"
fn = "brightness"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "9223372036854775807",
]
error = "value out of range"

[[test]]
name = "raises contrast without changing the dimensions"
fn = "contrast"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "20.0",
]
contains = "494844520000000400000002"

[[test]]
name = "lowers contrast without changing the dimensions"
fn = "contrast"
args = [
  'b"89504e470d0a1a0a0000000d4948445200000004000000020802000000f0caea34000000184944415478da63f8cfc0c000c6ff61e4ff8686062e1139008a7b0ab4bae879820000000049454e44ae426082"',
  "(-20.0)",
]
contains = "494844520000000400000002"
