[package]
name = "surrealism-webhook"
version = "0.1.0"
edition = "2024"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "Send HTTP/HTTPS webhook events from Surrealism (Slack, Discord, generic webhooks, etc.)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surrealdb/surrealism"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
surrealism = "0.5"
surrealdb-types = "3.2"
anyhow = "1"
serde_json = "1"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[lints.clippy]
allow_attributes = "allow"
